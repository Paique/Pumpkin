services:
  carrot:
    # Every push to main builds and publishes this image. Pick a tag from:
    # https://github.com/Paique/Pumpkin/pkgs/container/pumpkin/versions
    image: ghcr.io/paique/pumpkin:latest
    # The image declares no ENTRYPOINT, so the run command is set here.
    command: /usr/local/bin/pumpkin
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    volumes:
      # Carrot runs as UID/GID 988 (the Pterodactyl container user). On Linux
      # hosts, make sure the data directory has the correct ownership first:
      #   mkdir -p ./data
      #   sudo chown -R 988:988 ./data
      - ./data:/home/container
      # Use the following mount if you want to make your config immutable.
      # - ./pumpkin.toml:/home/container/pumpkin.toml:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: true
